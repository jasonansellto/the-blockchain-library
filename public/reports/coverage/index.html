<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blockchain Library — Coverage Report</title>
<style>:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#263b55;--text:#f5f8fc;--muted:#9fb2c8}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--bg);color:var(--text)}header{padding:24px;border-bottom:1px solid var(--line)}main{padding:20px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}.box,.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.controls{display:flex;gap:10px;margin-bottom:14px}input,select{padding:9px;border-radius:8px;border:1px solid var(--line);background:#081523;color:var(--text)}input{flex:1}.grid{display:grid;gap:8px}.meta{color:var(--muted)}.bar{height:6px;background:#14283f;border-radius:4px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#168cff}.chips span{display:inline-block;padding:2px 6px;border:1px solid var(--line);border-radius:999px;margin:4px 4px 0 0;color:#aac6e3}</style>
</head><body><header><h1>Knowledge Coverage Report</h1><p>Data-driven view of which topics still need books, research, tutorials, examples, quizzes, prompts, or learning-path coverage.</p></header><main><div id="summary" class="summary"></div><div class="controls"><input id="q" placeholder="Search topics..."><select id="status"><option value="">All coverage states</option><option>rich</option><option>developing</option><option>thin</option></select></div><div id="grid" class="grid"></div></main>
<script>
let rows=[];const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){const d=await fetch("/knowledge/coverage.json").then(r=>r.json());rows=d.topics;const s=d.summary;summary.innerHTML=`<div class="box"><b>${s.totalTopics}</b><div class="meta">topics</div></div><div class="box"><b>${s.averageCoverage}%</b><div class="meta">average coverage</div></div><div class="box"><b>${s.statusCounts.rich}</b><div class="meta">rich</div></div><div class="box"><b>${s.statusCounts.developing}</b><div class="meta">developing</div></div><div class="box"><b>${s.statusCounts.thin}</b><div class="meta">thin</div></div>`;render()}
function render(){const query=q.value.toLowerCase(),sv=status.value;const r=rows.filter(x=>(!sv||x.status===sv)&&(!query||JSON.stringify(x).toLowerCase().includes(query))).sort((a,b)=>a.score-b.score);grid.innerHTML=r.map(x=>{const missing=Object.entries(x.resources).filter(([,v])=>Array.isArray(v)?v.length===0:v===false).map(([k])=>k);return `<div class="row"><b>${esc(x.title)}</b> <span class="meta">· ${esc(x.category)} · ${x.status}</span><div>${x.score}%</div><div class="bar"><div class="fill" style="width:${x.score}%"></div></div><div class="chips">${missing.map(m=>`<span>missing ${esc(m)}</span>`).join("")}</div></div>`}).join("")}
q.oninput=render;status.onchange=render;load();
</script></body></html>
