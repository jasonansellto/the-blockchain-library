<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blockchain Library — Knowledge Explorer</title>
<style>:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#263b55;--text:#f5f8fc;--muted:#9fb2c8;--accent:#168cff}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;padding:14px 18px;background:#07111ff5;border-bottom:1px solid var(--line)}header strong{font-size:17px}input,select{background:#081523;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px}input{flex:1;max-width:500px}.wrap{display:grid;grid-template-columns:315px 1fr;min-height:calc(100vh - 62px)}aside{border-right:1px solid var(--line);padding:14px;overflow:auto}.stats{color:var(--muted);margin-bottom:10px}.list button{width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid #13263b;padding:9px;cursor:pointer}.list button:hover{background:#0b1b2d}main{padding:18px}.detail{max-width:1000px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#102f55;color:#9fd0ff}.nodes{display:flex;flex-wrap:wrap;gap:7px}.node{border:1px solid var(--line);padding:8px 10px;border-radius:8px;cursor:pointer}.node:hover{border-color:var(--accent)}.section h3{margin-bottom:8px}.resource{display:inline-block;margin:4px 6px 4px 0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:#b9d9fb;text-decoration:none}pre{white-space:pre-wrap;word-break:break-word;color:#c9d9ea}@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:320px}}</style>
</head><body><header><strong>Knowledge Explorer</strong><input id="q" placeholder="Search 100 topics, 250+ definitions, books, research..."><select id="type"><option value="">All types</option></select></header><div class="wrap"><aside><div id="stats" class="stats">Loading…</div><div id="list" class="list"></div></aside><main><div id="detail" class="detail"><div class="card"><h2>The Blockchain Library</h2><p>Select a knowledge object to see its metadata and connected resources.</p></div></div></main></div>
<script>
const S={catalog:[],map:new Map(),edges:new Map(),related:{}};const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const label=o=>o?.title||o?.term||o?.id||"Unknown";
async function load(){const [cat,graph,rel]=await Promise.all([fetch("/knowledge/catalog.json").then(r=>r.json()),fetch("/knowledge/graph.json").then(r=>r.json()),fetch("/knowledge/related.json").then(r=>r.json()).catch(()=>({}))]);S.catalog=cat;S.related=rel;cat.forEach(o=>S.map.set(o.uid,o));graph.edges.forEach(e=>{[e.from,e.to].forEach(k=>{if(!S.edges.has(k))S.edges.set(k,[])});S.edges.get(e.from).push(e);S.edges.get(e.to).push(e)});const types=[...new Set(cat.map(o=>o.type).filter(Boolean))].sort();type.innerHTML='<option value="">All types</option>'+types.map(t=>`<option>${esc(t)}</option>`).join("");stats.textContent=`${cat.length} objects · ${graph.edges.length} relationships`;render()}
function render(){const query=q.value.toLowerCase(),tv=type.value;const a=S.catalog.filter(o=>(!tv||o.type===tv)&&(!query||JSON.stringify(o).toLowerCase().includes(query))).slice(0,400);list.innerHTML=a.map(o=>`<button data-id="${esc(o.uid)}"><b>${esc(label(o))}</b><br><small>${esc(o.type||o.collection)}</small></button>`).join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>show(b.dataset.id))}
function resourceSections(o){if(o.type!=="topic")return"";const r=S.related[o.id];if(!r)return"";const groups=[["Glossary",r.glossary],["Books",r.books],["Research",r.research],["Tutorials",r.tutorials],["Code examples",r.codeExamples],["AI prompts",r.aiPrompts],["Quizzes",r.quizzes],["Learning paths",r.learningPaths]];return groups.filter(([,a])=>a?.length).map(([n,a])=>`<div class="section"><h3>${n}</h3>${a.map(x=>x.canonicalUrl?`<a class="resource" href="${esc(x.canonicalUrl)}">${esc(x.title)}</a>`:`<span class="resource">${esc(x.title)}</span>`).join("")}</div>`).join("")}
function show(uid){const o=S.map.get(uid);if(!o)return;const links=(S.edges.get(uid)||[]).map(e=>{const x=e.from===uid?e.to:e.from;return{e,o:S.map.get(x),x}}).filter(x=>x.o);detail.innerHTML=`<div class="card"><span class="badge">${esc(o.type||o.collection)}</span><h1>${esc(label(o))}</h1><p>${esc(o.summary||o.definition||o.subtitle||"")}</p>${o.category?`<p><b>Category:</b> ${esc(o.category)}</p>`:""}${o.canonicalUrl?`<p><a href="${esc(o.canonicalUrl)}">Open canonical page →</a></p>`:""}</div>${o.type==="topic"?`<div class="card"><h2>Related resources</h2>${resourceSections(o)||"<p>No mapped resources yet.</p>"}</div>`:""}<div class="card"><h2>Graph relationships</h2><div class="nodes">${links.length?links.map(x=>`<span class="node" data-rel="${esc(x.x)}">${esc(label(x.o))} · ${esc(x.e.type)}</span>`).join(""):"No relationships yet."}</div></div><div class="card"><h2>Structured object</h2><pre>${esc(JSON.stringify(o,null,2))}</pre></div>`;document.querySelectorAll("[data-rel]").forEach(n=>n.onclick=()=>show(n.dataset.rel))}
q.oninput=render;type.onchange=render;load();
</script></body></html>
