<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blockchain Library — Knowledge Graph Explorer</title>
<style>:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#263b55;--text:#f5f8fc;--muted:#9fb2c8;--accent:#168cff}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:16px 20px;background:#07111ff0;border-bottom:1px solid var(--line)}header strong{font-size:18px}input,select{background:#081523;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px}input{flex:1;max-width:520px}.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 66px)}aside{border-right:1px solid var(--line);padding:16px;overflow:auto}.stats{color:var(--muted);margin-bottom:12px}.list button{width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid #13263b;padding:10px;cursor:pointer}.list button:hover{background:#0b1b2d}main{padding:18px}.detail{max-width:900px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#102f55;color:#9fd0ff}.node{display:inline-block;border:1px solid var(--line);padding:8px 10px;border-radius:8px;margin:4px;cursor:pointer}.node:hover{border-color:var(--accent)}pre{white-space:pre-wrap;word-break:break-word;color:#c9d9ea}@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:340px}}</style>
</head><body><header><strong>Knowledge Graph Explorer</strong><input id="q" placeholder="Search topics and glossary terms..."><select id="type"><option value="">All types</option></select></header><div class="wrap"><aside><div id="stats" class="stats">Loading…</div><div id="list" class="list"></div></aside><main><div id="detail" class="detail"><div class="card"><h2>The Blockchain Library</h2><p>Select an object to explore its structured data and relationships.</p></div></div></main></div>
<script>
const S={catalog:[],map:new Map(),edges:new Map()};const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const label=o=>o?.title||o?.term||o?.id||"Unknown";
async function load(){const [cat,graph]=await Promise.all([fetch("/knowledge/catalog.json").then(r=>r.json()),fetch("/knowledge/graph.json").then(r=>r.json())]);S.catalog=cat;cat.forEach(o=>S.map.set(o.uid,o));graph.edges.forEach(e=>{[e.from,e.to].forEach(k=>{if(!S.edges.has(k))S.edges.set(k,[])});S.edges.get(e.from).push(e);S.edges.get(e.to).push(e)});const types=[...new Set(cat.map(o=>o.type))].sort();document.querySelector("#type").innerHTML='<option value="">All types</option>'+types.map(t=>`<option>${esc(t)}</option>`).join("");document.querySelector("#stats").textContent=`${cat.length} objects · ${graph.edges.length} relationships`;render()}
function render(){const q=document.querySelector("#q").value.toLowerCase(),type=document.querySelector("#type").value;const a=S.catalog.filter(o=>(!type||o.type===type)&&(!q||JSON.stringify(o).toLowerCase().includes(q))).slice(0,350);document.querySelector("#list").innerHTML=a.map(o=>`<button data-id="${esc(o.uid)}"><b>${esc(label(o))}</b><br><small>${esc(o.type)}</small></button>`).join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>show(b.dataset.id))}
function show(uid){const o=S.map.get(uid);if(!o)return;const links=(S.edges.get(uid)||[]).map(e=>{const x=e.from===uid?e.to:e.from;return {e,o:S.map.get(x),x}}).filter(x=>x.o);document.querySelector("#detail").innerHTML=`<div class="card"><span class="badge">${esc(o.type)}</span><h1>${esc(label(o))}</h1><p>${esc(o.summary||o.definition||"")}</p>${o.category?`<p><b>Category:</b> ${esc(o.category)}</p>`:""}${o.canonicalUrl?`<p><a href="${esc(o.canonicalUrl)}">Open canonical page →</a></p>`:""}</div><div class="card"><h2>Relationships</h2>${links.length?links.map(x=>`<span class="node" data-rel="${esc(x.x)}">${esc(label(x.o))} · ${esc(x.e.type)}</span>`).join(""):"No relationships yet."}</div><div class="card"><h2>Structured object</h2><pre>${esc(JSON.stringify(o,null,2))}</pre></div>`;document.querySelectorAll("[data-rel]").forEach(n=>n.onclick=()=>show(n.dataset.rel))}
q.addEventListener("input",render);type.addEventListener("change",render);load();
</script></body></html>
