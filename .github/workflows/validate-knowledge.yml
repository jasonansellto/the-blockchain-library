name: Validate Knowledge Engine

on:
  push:
    paths:
      - "data/knowledge/**"
      - "scripts/validate-knowledge.mjs"
      - "schemas/**"
      - "package.json"
  pull_request:
    paths:
      - "data/knowledge/**"
      - "scripts/validate-knowledge.mjs"
      - "schemas/**"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run validate:knowledge
