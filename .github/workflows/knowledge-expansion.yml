name: Knowledge Expansion CI
on:
  push:
    paths:
      - "data/knowledge/topics-expanded.json"
      - "data/knowledge/glossary-expanded.json"
      - "scripts/generate-expanded-knowledge.mjs"
      - "scripts/validate-expanded-knowledge.mjs"
  pull_request:
    paths:
      - "data/knowledge/topics-expanded.json"
      - "data/knowledge/glossary-expanded.json"
      - "scripts/generate-expanded-knowledge.mjs"
      - "scripts/validate-expanded-knowledge.mjs"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run build:expanded
