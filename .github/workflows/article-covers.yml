name: Article covers

# Renders a branded cover image for every published website article that has
# no featured image, and attaches it on theblockchainlibrary.com.
# Runs daily after the site's 9 am (Toronto) article import.

on:
  schedule:
    - cron: "37 14 * * *"       # daily, 14:37 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum covers to generate this run"
        required: false
        default: "150"

permissions:
  contents: read

concurrency:
  group: article-covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image tools
        run: npm install --no-save --no-package-lock @resvg/resvg-js@2 sharp@0.34

      - name: Generate and attach covers
        env:
          KNOWLEDGE_SYNC_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_TOKEN }}
          COVER_LIMIT: ${{ github.event.inputs.limit || '150' }}
        run: npm run covers
